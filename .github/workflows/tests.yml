name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.apcu && ' + APCu' || ' (file store)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        apcu: [true, false]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.apcu && 'apcu, pcntl' || 'pcntl, :apcu' }}
          ini-values: ${{ matrix.apcu && 'apc.enable_cli=1, opcache.enable_cli=1, opcache.file_update_protection=0' || 'opcache.enable_cli=1, opcache.file_update_protection=0' }}
          coverage: none
          tools: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Syntax check (PHP ${{ matrix.php }})
        run: find src plugins tests bench config examples bootstrap.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: The single file builds, and PHP ${{ matrix.php }} reads it
        run: |
          php build/single-file.php --build=ci
          php build/single-file.php --edition=stats --build=ci
          php -l build/out/request-shield.php > /dev/null
          php -l build/out/request-shield-stats.php > /dev/null

      - name: Tests
        env:
          # With APCu every test must run; without it the APCu store test is skipped on purpose.
          TESTS_FAIL_ON_SKIP: ${{ matrix.apcu && '1' || '0' }}
        run: php tests/run.php

      - name: Cost of a passing request (smoke benchmark)
        run: php -d opcache.file_update_protection=0 bench/overhead.php 20000

  # Shared hosting at its most restrictive (ADR 0013, tier S1): the servers the
  # end-to-end tests start run without APCu, without allow_url_fopen, with the
  # shell functions disabled and 64 MB -- the shield must decide the same.
  minimal-hosting:
    name: PHP 8.0, minimal hosting (S1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: 'pcntl, :apcu'
          ini-values: 'opcache.enable_cli=1, opcache.file_update_protection=0'
          coverage: none
          tools: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Tests, the servers restricted
        env:
          TESTS_HOSTING: minimal
        run: php tests/run.php

  # The suite against the built single file (0031 E.3): REQUEST_SHIELD_ENTRY
  # makes the runner, the end-to-end servers and the command line use
  # build/out/request-shield.php (with request-shield-stats.php) instead of
  # bootstrap.php. Skips are expected here: the demos show the source tree's
  # integration, and ShippedTest's cases need the source tree's Shipped.
  single:
    name: PHP 8.4 + APCu, against the single file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: 'apcu, pcntl'
          ini-values: 'apc.enable_cli=1, opcache.enable_cli=1, opcache.file_update_protection=0'
          coverage: none
          tools: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build the single file
        run: |
          php build/single-file.php --build=ci
          php build/single-file.php --edition=stats --build=ci

      - name: Tests against the file
        env:
          REQUEST_SHIELD_ENTRY: ${{ github.workspace }}/build/out/request-shield.php
        run: php tests/run.php
