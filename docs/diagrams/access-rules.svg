<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>An admin area only for the office&apos;s addresses, and a form only where the site expects one; everyone else is turned away before the site starts</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-access-rules" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M136 48 H211" marker-end="url(#rsd-access-rules)"/><path class="arrow" d="M341 48 H415" marker-end="url(#rsd-access-rules)"/><text class="m" x="378" y="40" text-anchor="middle" font-size="11">the office</text><path class="arrow go" d="M545 48 H620" marker-end="url(#rsd-access-rules)"/><text class="m" x="582.5" y="40" text-anchor="middle" font-size="11">yes</text><path class="arrow" d="M278 76 V101 H120 V126" marker-end="url(#rsd-access-rules)"/><text class="m" x="126" y="117" text-anchor="start" font-size="11">anyone else</text><path class="arrow" d="M482 76 V101 H640 V126" marker-end="url(#rsd-access-rules)"/><text class="m" x="646" y="117" text-anchor="start" font-size="11">no</text><rect class="box" x="10" y="20" width="126" height="56" rx="10" stroke-width="1.5"/><text class="t" x="73" y="44" text-anchor="middle" font-weight="700">A request</text><text class="m" x="73" y="62" text-anchor="middle" font-size="12">POST /admin/save</text><rect class="warnbox" x="215" y="20" width="126" height="56" rx="10" stroke-width="1.5"/><text class="t" x="278" y="44" text-anchor="middle" font-weight="700">restrict</text><text class="m" x="278" y="62" text-anchor="middle" font-size="12">the area: whose address?</text><rect class="warnbox" x="419" y="20" width="126" height="56" rx="10" stroke-width="1.5"/><text class="t" x="482" y="44" text-anchor="middle" font-weight="700">allow</text><text class="m" x="482" y="62" text-anchor="middle" font-size="12">this method here?</text><rect class="okbox" x="624" y="20" width="126" height="56" rx="10" stroke-width="1.5"/><text class="t" x="687" y="53" text-anchor="middle" font-weight="700">Your site</text><rect class="nobox" x="10" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="120" y="154" text-anchor="middle" font-weight="700">403</text><text class="m" x="120" y="172" text-anchor="middle" font-size="12">not from the office</text><rect class="nobox" x="530" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640" y="154" text-anchor="middle" font-weight="700">405</text><text class="m" x="640" y="172" text-anchor="middle" font-size="12">no form expected here</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">The path is matched as the site routes it: //admin or /%61dmin do not get past.</text></svg>
