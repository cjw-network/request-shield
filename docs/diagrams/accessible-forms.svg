<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>A captcha asks every person to solve a puzzle and shuts some out; the browser check asks only the browser, and nobody sees a puzzle</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-accessible-forms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M200 48 H281" marker-end="url(#rsd-accessible-forms)"/><text class="m" x="240.5" y="40" text-anchor="middle" font-size="11">the old way</text><path class="arrow" d="M475 48 H556" marker-end="url(#rsd-accessible-forms)"/><text class="m" x="515.5" y="40" text-anchor="middle" font-size="11">a puzzle</text><path class="arrow go" d="M105 76 V101 H120 V126" marker-end="url(#rsd-accessible-forms)"/><text class="m" x="126" y="117" text-anchor="start" font-size="11">with the shield</text><path class="arrow go" d="M230 158 H526" marker-end="url(#rsd-accessible-forms)"/><text class="m" x="378" y="150" text-anchor="middle" font-size="11">a task for the browser</text><rect class="box" x="10" y="20" width="190" height="56" rx="10" stroke-width="1.5"/><text class="t" x="105" y="44" text-anchor="middle" font-weight="700">A form is sent</text><text class="m" x="105" y="62" text-anchor="middle" font-size="12">contact, sign-in</text><rect class="warnbox" x="285" y="20" width="190" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="44" text-anchor="middle" font-weight="700">A captcha</text><text class="m" x="380" y="62" text-anchor="middle" font-size="12">pictures, letters</text><rect class="nobox" x="560" y="20" width="190" height="56" rx="10" stroke-width="1.5"/><text class="t" x="655" y="44" text-anchor="middle" font-weight="700">Some cannot</text><text class="m" x="655" y="62" text-anchor="middle" font-size="12">it shuts them out</text><rect class="okbox" x="10" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="120" y="154" text-anchor="middle" font-weight="700">The browser check</text><text class="m" x="120" y="172" text-anchor="middle" font-size="12">in the background, while they type</text><rect class="okbox" x="530" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640" y="154" text-anchor="middle" font-weight="700">The form arrives</text><text class="m" x="640" y="172" text-anchor="middle" font-size="12">nobody saw a puzzle</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">The browser solves a small sum by itself: no eyes, no ears, no steady hand needed.</text></svg>
