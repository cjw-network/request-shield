<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>The API serves the same data the pages and the command line show: a script over HTTP with a token, a CMS in the same process with Api::call()</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M229 48 H267" marker-end="url(#rsd-api)"/><text class="m" x="248" y="40" text-anchor="middle" font-size="11">JSON</text><path class="arrow go" d="M490 48 H527" marker-end="url(#rsd-api)"/><path class="arrow" d="M640 130 V105 H640.5 V80" marker-end="url(#rsd-api)"/><text class="m" x="646.5" y="99" text-anchor="start" font-size="11">no HTTP</text><path class="arrow" d="M120 130 V105 H640.5 V80" marker-end="url(#rsd-api)"/><rect class="box" x="10" y="20" width="219" height="56" rx="10" stroke-width="1.5"/><text class="t" x="119.5" y="44" text-anchor="middle" font-weight="700">A script, a JS page</text><text class="m" x="119.5" y="62" text-anchor="middle" font-size="12">Authorization: Bearer</text><rect class="warnbox" x="271" y="20" width="219" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380.5" y="44" text-anchor="middle" font-weight="700">/rs/api/v1</text><text class="m" x="380.5" y="62" text-anchor="middle" font-size="12">guarded like the dashboard</text><rect class="okbox" x="531" y="20" width="219" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640.5" y="44" text-anchor="middle" font-weight="700">One service</text><text class="m" x="640.5" y="62" text-anchor="middle" font-size="12">the data, once</text><rect class="box" x="10" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="120" y="154" text-anchor="middle" font-weight="700">The command line</text><text class="m" x="120" y="172" text-anchor="middle" font-size="12">request-shield api</text><rect class="box" x="530" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640" y="154" text-anchor="middle" font-weight="700">A CMS backend</text><text class="m" x="640" y="172" text-anchor="middle" font-size="12">Api::call(), same process</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">Every answer {data, meta}; every problem RFC 9457; writes only with set api-write on.</text></svg>
