<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>Cron fetches the public blocklists the rules name; each list gets its own action, searched with the deny list in microseconds</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-blocklist-feeds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M154 48 H304" marker-end="url(#rsd-blocklist-feeds)"/><path class="arrow go" d="M452 48 H602" marker-end="url(#rsd-blocklist-feeds)"/><text class="m" x="527" y="40" text-anchor="middle" font-size="11">your network taken out</text><path class="arrow" d="M678 76 V101 H120 V126" marker-end="url(#rsd-blocklist-feeds)"/><path class="arrow" d="M678 76 V101 H380 V126" marker-end="url(#rsd-blocklist-feeds)"/><path class="arrow" d="M678 76 V101 H640 V126" marker-end="url(#rsd-blocklist-feeds)"/><rect class="box" x="10" y="20" width="144" height="56" rx="10" stroke-width="1.5"/><text class="t" x="82" y="44" text-anchor="middle" font-weight="700">Public lists</text><text class="m" x="82" y="62" text-anchor="middle" font-size="12">DROP, DShield, Tor …</text><rect class="warnbox" x="308" y="20" width="144" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="44" text-anchor="middle" font-weight="700">feeds update</text><text class="m" x="380" y="62" text-anchor="middle" font-size="12">cron, pull only</text><rect class="okbox" x="606" y="20" width="144" height="56" rx="10" stroke-width="1.5"/><text class="t" x="678" y="44" text-anchor="middle" font-weight="700">One sorted table</text><text class="m" x="678" y="62" text-anchor="middle" font-size="12">with the deny list</text><rect class="nobox" x="10" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="120" y="154" text-anchor="middle" font-weight="700">deny</text><text class="m" x="120" y="172" text-anchor="middle" font-size="12">403</text><rect class="warnbox" x="270" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="154" text-anchor="middle" font-weight="700">check</text><text class="m" x="380" y="172" text-anchor="middle" font-size="12">the browser check</text><rect class="box" x="530" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640" y="154" text-anchor="middle" font-weight="700">count</text><text class="m" x="640" y="172" text-anchor="middle" font-size="12">only logged</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">Nothing about the visitors leaves the server; a list that shrank to less than half is kept.</text></svg>
