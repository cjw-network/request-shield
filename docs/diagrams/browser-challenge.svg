<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>A visitor without a pass gets a small task; a real browser solves it in a moment and holds a pass for an hour</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-browser-challenge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M216 48 H273" marker-end="url(#rsd-browser-challenge)"/><text class="m" x="244.5" y="40" text-anchor="middle" font-size="11">no pass</text><path class="arrow go" d="M483 48 H540" marker-end="url(#rsd-browser-challenge)"/><text class="m" x="511.5" y="40" text-anchor="middle" font-size="11">solved</text><path class="arrow" d="M380 76 V101 H120 V126" marker-end="url(#rsd-browser-challenge)"/><text class="m" x="126" y="117" text-anchor="start" font-size="11">not solved</text><path class="arrow go" d="M647 76 V101 H640 V126" marker-end="url(#rsd-browser-challenge)"/><text class="m" x="646" y="117" text-anchor="start" font-size="11">go</text><rect class="box" x="10" y="20" width="206" height="56" rx="10" stroke-width="1.5"/><text class="t" x="113" y="44" text-anchor="middle" font-weight="700">A visitor</text><text class="m" x="113" y="62" text-anchor="middle" font-size="12">too fast, or a checked page</text><rect class="warnbox" x="277" y="20" width="206" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="44" text-anchor="middle" font-weight="700">The check page</text><text class="m" x="380" y="62" text-anchor="middle" font-size="12">a task, no clicking</text><rect class="okbox" x="544" y="20" width="206" height="56" rx="10" stroke-width="1.5"/><text class="t" x="647" y="44" text-anchor="middle" font-weight="700">A pass cookie</text><text class="m" x="647" y="62" text-anchor="middle" font-size="12">an hour, signed</text><rect class="nobox" x="10" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="120" y="154" text-anchor="middle" font-weight="700">A program</text><text class="m" x="120" y="172" text-anchor="middle" font-size="12">no JavaScript: no pass</text><rect class="okbox" x="530" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640" y="154" text-anchor="middle" font-weight="700">Your page</text><text class="m" x="640" y="172" text-anchor="middle" font-size="12">the same request again</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">The task gets harder the faster a visitor asks; verified search engines are never checked.</text></svg>
