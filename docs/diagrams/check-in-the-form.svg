<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>The box in the form checks the browser while the visitor types; the form, files included, goes straight through</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-check-in-the-form" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M208 48 H277" marker-end="url(#rsd-check-in-the-form)"/><path class="arrow go" d="M479 48 H548" marker-end="url(#rsd-check-in-the-form)"/><text class="m" x="513.5" y="40" text-anchor="middle" font-size="11">✓ checked</text><path class="arrow go" d="M651 76 V101 H380 V126" marker-end="url(#rsd-check-in-the-form)"/><text class="m" x="386" y="117" text-anchor="start" font-size="11">the shield takes the answer out</text><rect class="box" x="10" y="20" width="198" height="56" rx="10" stroke-width="1.5"/><text class="t" x="109" y="44" text-anchor="middle" font-weight="700">The visitor types</text><text class="m" x="109" y="62" text-anchor="middle" font-size="12">first input</text><rect class="warnbox" x="281" y="20" width="198" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="44" text-anchor="middle" font-weight="700">The box</text><text class="m" x="380" y="62" text-anchor="middle" font-size="12">fetches a task, solves it</text><rect class="okbox" x="552" y="20" width="198" height="56" rx="10" stroke-width="1.5"/><text class="t" x="651" y="44" text-anchor="middle" font-weight="700">The form is sent</text><text class="m" x="651" y="62" text-anchor="middle" font-size="12">with the answer, files too</text><rect class="okbox" x="270" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="154" text-anchor="middle" font-weight="700">Your site</text><text class="m" x="380" y="172" text-anchor="middle" font-size="12">never sees the answer</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">Without JavaScript the form is sent without an answer, and the check page comes as before.</text></svg>
