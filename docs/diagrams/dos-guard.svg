<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>On shared hosting a flood from one address gets the browser check, then a pause, before the framework and the database start</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-dos-guard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M165 48 H201" marker-end="url(#rsd-dos-guard)"/><path class="arrow" d="M360 48 H396" marker-end="url(#rsd-dos-guard)"/><path class="arrow" d="M555 48 H591" marker-end="url(#rsd-dos-guard)"/><path class="arrow go" d="M282.5 76 V101 H380 V126" marker-end="url(#rsd-dos-guard)"/><text class="m" x="386" y="117" text-anchor="start" font-size="11">below the limit</text><rect class="box" x="10" y="20" width="155" height="56" rx="10" stroke-width="1.5"/><text class="t" x="87.5" y="44" text-anchor="middle" font-weight="700">A flood</text><text class="m" x="87.5" y="62" text-anchor="middle" font-size="12">from one address</text><rect class="warnbox" x="205" y="20" width="155" height="56" rx="10" stroke-width="1.5"/><text class="t" x="282.5" y="44" text-anchor="middle" font-weight="700">Counted in files</text><text class="m" x="282.5" y="62" text-anchor="middle" font-size="12">no APCu needed</text><rect class="warnbox" x="400" y="20" width="155" height="56" rx="10" stroke-width="1.5"/><text class="t" x="477.5" y="44" text-anchor="middle" font-weight="700">Past 120 a minute</text><text class="m" x="477.5" y="62" text-anchor="middle" font-size="12">the browser check</text><rect class="nobox" x="595" y="20" width="155" height="56" rx="10" stroke-width="1.5"/><text class="t" x="672.5" y="44" text-anchor="middle" font-weight="700">Past 300</text><text class="m" x="672.5" y="62" text-anchor="middle" font-size="12">429, please wait</text><rect class="okbox" x="270" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="154" text-anchor="middle" font-weight="700">Your site</text><text class="m" x="380" y="172" text-anchor="middle" font-size="12">the PHP workers stay free</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">Every refused request costs well under 0.1 ms instead of a page of the framework.</text></svg>
