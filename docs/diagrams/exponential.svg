<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>An Exponential site gets three rule files and one line in config.php; the shield answers scanners, floods and stray forms before the kernel starts</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-exponential" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M192 48 H285" marker-end="url(#rsd-exponential)"/><path class="arrow go" d="M471 48 H564" marker-end="url(#rsd-exponential)"/><text class="m" x="517.5" y="40" text-anchor="middle" font-size="11">real visitors</text><path class="arrow" d="M380 76 V101 H380 V126" marker-end="url(#rsd-exponential)"/><text class="m" x="386" y="117" text-anchor="start" font-size="11">the junk</text><rect class="box" x="10" y="20" width="182" height="56" rx="10" stroke-width="1.5"/><text class="t" x="101" y="44" text-anchor="middle" font-weight="700">Requests</text><text class="m" x="101" y="62" text-anchor="middle" font-size="12">scanners, scrapers, bots</text><rect class="warnbox" x="289" y="20" width="182" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="44" text-anchor="middle" font-weight="700">request-shield</text><text class="m" x="380" y="62" text-anchor="middle" font-size="12">exponential*.rules</text><rect class="okbox" x="568" y="20" width="182" height="56" rx="10" stroke-width="1.5"/><text class="t" x="659" y="44" text-anchor="middle" font-weight="700">Exponential</text><text class="m" x="659" y="62" text-anchor="middle" font-size="12">only the rest</text><rect class="nobox" x="270" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="154" text-anchor="middle" font-weight="700">Refused or slowed</text><text class="m" x="380" y="172" text-anchor="middle" font-size="12">settings/site.ini, node counting</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">The kernel spends 20 to 150 ms on each request; the shield a few microseconds.</text></svg>
