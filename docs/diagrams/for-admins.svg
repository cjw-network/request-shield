<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>A new rule is watched first, then switched on; the log names every refusal, and strict mode is ready for an attack</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-for-admins" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M204 48 H279" marker-end="url(#rsd-for-admins)"/><text class="m" x="241.5" y="40" text-anchor="middle" font-size="11">a few days</text><path class="arrow go" d="M477 48 H552" marker-end="url(#rsd-for-admins)"/><text class="m" x="514.5" y="40" text-anchor="middle" font-size="11">none</text><path class="arrow" d="M653 76 V101 H120 V126" marker-end="url(#rsd-for-admins)"/><text class="m" x="126" y="117" text-anchor="start" font-size="11">a visitor reports</text><path class="arrow" d="M653 76 V101 H640 V126" marker-end="url(#rsd-for-admins)"/><text class="m" x="646" y="117" text-anchor="start" font-size="11">a flood</text><rect class="warnbox" x="10" y="20" width="194" height="56" rx="10" stroke-width="1.5"/><text class="t" x="107" y="44" text-anchor="middle" font-weight="700">monitor</text><text class="m" x="107" y="62" text-anchor="middle" font-size="12">logs, refuses nobody</text><rect class="box" x="283" y="20" width="194" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="44" text-anchor="middle" font-weight="700">The log and test</text><text class="m" x="380" y="62" text-anchor="middle" font-size="12">any real visitor hit?</text><rect class="okbox" x="556" y="20" width="194" height="56" rx="10" stroke-width="1.5"/><text class="t" x="653" y="44" text-anchor="middle" font-weight="700">enforce</text><text class="m" x="653" y="62" text-anchor="middle" font-size="12">the rules act</text><rect class="box" x="10" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="120" y="154" text-anchor="middle" font-weight="700">A false hit</text><text class="m" x="120" y="172" text-anchor="middle" font-size="12">the log names the rule</text><rect class="nobox" x="530" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640" y="154" text-anchor="middle" font-weight="700">Under attack</text><text class="m" x="640" y="172" text-anchor="middle" font-size="12">set mode strict</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">trace replays one request, step by step; unblock … at opens a rule where it is in the way.</text></svg>
