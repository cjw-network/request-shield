<svg class="rsd" role="img" viewBox="0 0 760 116" width="100%" xmlns="http://www.w3.org/2000/svg"><title>A link or a token from your hoster opens the statistics of your own websites, and nothing else</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-for-customers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow go" d="M208 48 H277" marker-end="url(#rsd-for-customers)"/><text class="m" x="242.5" y="40" text-anchor="middle" font-size="11">one click</text><path class="arrow" d="M552 48 H483" marker-end="url(#rsd-for-customers)"/><text class="m" x="517.5" y="40" text-anchor="middle" font-size="11">typed in</text><rect class="box" x="10" y="20" width="198" height="56" rx="10" stroke-width="1.5"/><text class="t" x="109" y="44" text-anchor="middle" font-weight="700">Your hosting panel</text><text class="m" x="109" y="62" text-anchor="middle" font-size="12">a signed link</text><rect class="okbox" x="281" y="20" width="198" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="44" text-anchor="middle" font-weight="700">Your statistics</text><text class="m" x="380" y="62" text-anchor="middle" font-size="12">your websites, side by side</text><rect class="box" x="552" y="20" width="198" height="56" rx="10" stroke-width="1.5"/><text class="t" x="651" y="44" text-anchor="middle" font-weight="700">Or a token</text><text class="m" x="651" y="62" text-anchor="middle" font-size="12">kept like a password</text><text class="m" x="380" y="106" text-anchor="middle" font-size="12">Other customers, the rules and the server&apos;s settings are never shown to you.</text></svg>
