<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>A form&apos;s script sends JSON to the forms&apos; endpoint; the shield lets it through only from the own website and five times an hour per address, the sixth gets 429</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-form-limits" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M165 48 H201" marker-end="url(#rsd-form-limits)"/><path class="arrow" d="M360 48 H396" marker-end="url(#rsd-form-limits)"/><text class="m" x="378" y="40" text-anchor="middle" font-size="11">yes</text><path class="arrow go" d="M555 48 H591" marker-end="url(#rsd-form-limits)"/><text class="m" x="573" y="40" text-anchor="middle" font-size="11">yes</text><path class="arrow" d="M282.5 76 V101 H120 V126" marker-end="url(#rsd-form-limits)"/><text class="m" x="126" y="117" text-anchor="start" font-size="11">no</text><path class="arrow" d="M477.5 76 V101 H640 V126" marker-end="url(#rsd-form-limits)"/><text class="m" x="646" y="117" text-anchor="start" font-size="11">the sixth</text><rect class="box" x="10" y="20" width="155" height="56" rx="10" stroke-width="1.5"/><text class="t" x="87.5" y="44" text-anchor="middle" font-weight="700">The form&apos;s script</text><text class="m" x="87.5" y="62" text-anchor="middle" font-size="12">POST, JSON</text><rect class="warnbox" x="205" y="20" width="155" height="56" rx="10" stroke-width="1.5"/><text class="t" x="282.5" y="44" text-anchor="middle" font-weight="700">Same website?</text><text class="m" x="282.5" y="62" text-anchor="middle" font-size="12">post-origin</text><rect class="warnbox" x="400" y="20" width="155" height="56" rx="10" stroke-width="1.5"/><text class="t" x="477.5" y="44" text-anchor="middle" font-weight="700">5 an hour?</text><text class="m" x="477.5" y="62" text-anchor="middle" font-size="12">limit</text><rect class="okbox" x="595" y="20" width="155" height="56" rx="10" stroke-width="1.5"/><text class="t" x="672.5" y="44" text-anchor="middle" font-weight="700">Your site</text><text class="m" x="672.5" y="62" text-anchor="middle" font-size="12">saves it</text><rect class="nobox" x="10" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="120" y="154" text-anchor="middle" font-weight="700">403</text><text class="m" x="120" y="172" text-anchor="middle" font-size="12">sent from another website</text><rect class="nobox" x="530" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640" y="154" text-anchor="middle" font-weight="700">429, please wait</text><text class="m" x="640" y="172" text-anchor="middle" font-size="12">Retry-After: when it may try again</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">Reading the job offer and opening the form count nothing: only the endpoint is counted.</text></svg>
