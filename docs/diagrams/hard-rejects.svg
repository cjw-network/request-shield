<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>Requests no browser sends are refused before the site starts, cheapest check first, stopping at the first that fails</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-hard-rejects" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M126 48 H162" marker-end="url(#rsd-hard-rejects)"/><path class="arrow" d="M282 48 H318" marker-end="url(#rsd-hard-rejects)"/><path class="arrow" d="M438 48 H474" marker-end="url(#rsd-hard-rejects)"/><path class="arrow" d="M594 48 H630" marker-end="url(#rsd-hard-rejects)"/><path class="arrow go" d="M692 76 V101 H380 V126" marker-end="url(#rsd-hard-rejects)"/><text class="m" x="386" y="117" text-anchor="start" font-size="11">all fine</text><rect class="box" x="10" y="20" width="116" height="56" rx="10" stroke-width="1.5"/><text class="t" x="68" y="53" text-anchor="middle" font-weight="700">A request</text><rect class="warnbox" x="166" y="20" width="116" height="56" rx="10" stroke-width="1.5"/><text class="t" x="224" y="44" text-anchor="middle" font-weight="700">Method</text><text class="m" x="224" y="62" text-anchor="middle" font-size="12">405</text><rect class="warnbox" x="322" y="20" width="116" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="44" text-anchor="middle" font-weight="700">Sizes</text><text class="m" x="380" y="62" text-anchor="middle" font-size="12">414, 400, 431</text><rect class="warnbox" x="478" y="20" width="116" height="56" rx="10" stroke-width="1.5"/><text class="t" x="536" y="44" text-anchor="middle" font-weight="700">Broken, disguised</text><text class="m" x="536" y="62" text-anchor="middle" font-size="12">400</text><rect class="warnbox" x="634" y="20" width="116" height="56" rx="10" stroke-width="1.5"/><text class="t" x="692" y="44" text-anchor="middle" font-weight="700">Website name</text><text class="m" x="692" y="62" text-anchor="middle" font-size="12">404</text><rect class="okbox" x="270" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="154" text-anchor="middle" font-weight="700">The other checks</text><text class="m" x="380" y="172" text-anchor="middle" font-size="12">then your site</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">A refused request is never counted, and never reaches the site or a cache.</text></svg>
