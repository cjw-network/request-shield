<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>Behind a balancer every request comes from its address; with trust the shield counts each visitor by the address the balancer forwards</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-load-balancer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M113 48 H218" marker-end="url(#rsd-load-balancer)"/><path class="arrow" d="M325 48 H431" marker-end="url(#rsd-load-balancer)"/><text class="m" x="378" y="40" text-anchor="middle" font-size="11">X-Forwarded-For</text><path class="arrow go" d="M538 48 H643" marker-end="url(#rsd-load-balancer)"/><text class="m" x="590.5" y="40" text-anchor="middle" font-size="11">per visitor</text><path class="arrow" d="M486.5 76 V101 H380 V126" marker-end="url(#rsd-load-balancer)"/><text class="m" x="386" y="117" text-anchor="start" font-size="11">no trust line</text><rect class="box" x="10" y="20" width="103" height="56" rx="10" stroke-width="1.5"/><text class="t" x="61.5" y="44" text-anchor="middle" font-weight="700">Visitors</text><text class="m" x="61.5" y="62" text-anchor="middle" font-size="12">each its own address</text><rect class="box" x="222" y="20" width="103" height="56" rx="10" stroke-width="1.5"/><text class="t" x="273.5" y="44" text-anchor="middle" font-weight="700">The balancer</text><text class="m" x="273.5" y="62" text-anchor="middle" font-size="12">10.0.0.5, ends TLS</text><rect class="warnbox" x="435" y="20" width="103" height="56" rx="10" stroke-width="1.5"/><text class="t" x="486.5" y="44" text-anchor="middle" font-weight="700">request-shield</text><text class="m" x="486.5" y="62" text-anchor="middle" font-size="12">trust 10.0.0.5</text><rect class="okbox" x="647" y="20" width="103" height="56" rx="10" stroke-width="1.5"/><text class="t" x="698.5" y="53" text-anchor="middle" font-weight="700">app:8080</text><rect class="nobox" x="270" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="154" text-anchor="middle" font-weight="700">Without trust</text><text class="m" x="380" y="172" text-anchor="middle" font-size="12">everyone shares one budget</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">From anyone else X-Forwarded-* are removed before the application runs.</text></svg>
