<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>An expect line next to a rule says what should happen to one request; request-shield test decides each on a fresh store and says which fails</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-rule-examples" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M230 48 H266" marker-end="url(#rsd-rule-examples)"/><path class="arrow" d="M490 48 H526" marker-end="url(#rsd-rule-examples)"/><path class="arrow go" d="M640 76 V101 H120 V126" marker-end="url(#rsd-rule-examples)"/><text class="m" x="126" y="117" text-anchor="start" font-size="11">as written</text><path class="arrow" d="M640 76 V101 H640 V126" marker-end="url(#rsd-rule-examples)"/><text class="m" x="646" y="117" text-anchor="start" font-size="11">not as written</text><rect class="box" x="10" y="20" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="120" y="44" text-anchor="middle" font-weight="700">A rule</text><text class="m" x="120" y="62" text-anchor="middle" font-size="12">[SITE-ADMIN] restrict …</text><rect class="box" x="270" y="20" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="44" text-anchor="middle" font-weight="700">Its examples</text><text class="m" x="380" y="62" text-anchor="middle" font-size="12">expect GET /admin/ … 403</text><rect class="warnbox" x="530" y="20" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640" y="44" text-anchor="middle" font-weight="700">request-shield test</text><text class="m" x="640" y="62" text-anchor="middle" font-size="12">each on a fresh store</text><rect class="okbox" x="10" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="120" y="154" text-anchor="middle" font-weight="700">All pass</text><text class="m" x="120" y="172" text-anchor="middle" font-size="12">exit 0, deploy</text><rect class="nobox" x="530" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640" y="154" text-anchor="middle" font-weight="700">One fails</text><text class="m" x="640" y="172" text-anchor="middle" font-size="12">exit 1, with what it got</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">The demo&apos;s examples are its rows; a rule without an example is named.</text></svg>
