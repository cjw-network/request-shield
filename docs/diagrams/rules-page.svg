<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>The rules page shows every rule in plain words with how often it decided, and the tester shows what happens to any address, step by step</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-rules-page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M184 48 H289" marker-end="url(#rsd-rules-page)"/><text class="m" x="236.5" y="40" text-anchor="middle" font-size="11">nothing counted</text><path class="arrow go" d="M467 48 H572" marker-end="url(#rsd-rules-page)"/><path class="arrow" d="M663 76 V101 H120 V126" marker-end="url(#rsd-rules-page)"/><text class="m" x="126" y="117" text-anchor="start" font-size="11">links to its row</text><rect class="box" x="10" y="20" width="174" height="56" rx="10" stroke-width="1.5"/><text class="t" x="97" y="44" text-anchor="middle" font-weight="700">An address to try</text><text class="m" x="97" y="62" text-anchor="middle" font-size="12">GET /wp-login.php</text><rect class="warnbox" x="293" y="20" width="174" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="44" text-anchor="middle" font-weight="700">Every check, in order</text><text class="m" x="380" y="62" text-anchor="middle" font-size="12">✓ fine, ✕ refused here</text><rect class="okbox" x="576" y="20" width="174" height="56" rx="10" stroke-width="1.5"/><text class="t" x="663" y="44" text-anchor="middle" font-weight="700">One sentence</text><text class="m" x="663" y="62" text-anchor="middle" font-size="12">who decides, and why</text><rect class="box" x="10" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="120" y="154" text-anchor="middle" font-weight="700">Every rule</text><text class="m" x="120" y="172" text-anchor="middle" font-size="12">its ID, its line, its count</text><rect class="box" x="530" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640" y="154" text-anchor="middle" font-weight="700">Every setting</text><text class="m" x="640" y="172" text-anchor="middle" font-size="12">the secret only as set</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">The same check on the command line: request-shield trace site.rules &quot;GET https://…&quot;.</text></svg>
