<svg class="rsd" role="img" viewBox="0 0 760 226" width="100%" xmlns="http://www.w3.org/2000/svg"><title>The settings are checked once and kept compiled; a request reads nothing, and what the hosting allows sets the tier</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-settings" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><path class="arrow" d="M229 48 H267" marker-end="url(#rsd-settings)"/><path class="arrow go" d="M490 48 H527" marker-end="url(#rsd-settings)"/><text class="m" x="508.5" y="40" text-anchor="middle" font-size="11">fine</text><path class="arrow" d="M640.5 76 V101 H120 V126" marker-end="url(#rsd-settings)"/><path class="arrow" d="M640.5 76 V101 H380 V126" marker-end="url(#rsd-settings)"/><path class="arrow" d="M640.5 76 V101 H640 V126" marker-end="url(#rsd-settings)"/><rect class="box" x="10" y="20" width="219" height="56" rx="10" stroke-width="1.5"/><text class="t" x="119.5" y="53" text-anchor="middle" font-weight="700">Rule file or PHP array</text><rect class="warnbox" x="271" y="20" width="219" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380.5" y="44" text-anchor="middle" font-weight="700">Checked once</text><text class="m" x="380.5" y="62" text-anchor="middle" font-size="12">every key, every value</text><rect class="okbox" x="531" y="20" width="219" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640.5" y="44" text-anchor="middle" font-weight="700">Compiled settings</text><text class="m" x="640.5" y="62" text-anchor="middle" font-size="12">a PHP file, OPcache</text><rect class="okbox" x="10" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="120" y="154" text-anchor="middle" font-weight="700">Tier S2</text><text class="m" x="120" y="172" text-anchor="middle" font-size="12">APCu: counters in memory</text><rect class="okbox" x="270" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="380" y="154" text-anchor="middle" font-weight="700">Tier S1</text><text class="m" x="380" y="172" text-anchor="middle" font-size="12">a writable folder</text><rect class="warnbox" x="530" y="130" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="640" y="154" text-anchor="middle" font-weight="700">Tier S0</text><text class="m" x="640" y="172" text-anchor="middle" font-size="12">nothing to write: compiled per request</text><text class="m" x="380" y="216" text-anchor="middle" font-size="12">request-shield check names the tier a hosting gives; no feature fails without its tier, it switches off and says so.</text></svg>
