<svg class="rsd" role="img" viewBox="0 0 760 430" width="100%" xmlns="http://www.w3.org/2000/svg"><title>The browser check, step by step</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><rect class="box" x="35" y="8" width="150" height="34" rx="8"/><text class="t" x="110" y="30" text-anchor="middle" font-weight="700">Browser</text><path class="lane" d="M110 42 V420"/><rect class="box" x="315" y="8" width="150" height="34" rx="8"/><text class="t" x="390" y="30" text-anchor="middle" font-weight="700">request-shield</text><path class="lane" d="M390 42 V420"/><rect class="box" x="565" y="8" width="150" height="34" rx="8"/><text class="t" x="640" y="30" text-anchor="middle" font-weight="700">Your site</text><path class="lane" d="M640 42 V420"/><path class="arrow" d="M110 82 H390" marker-end="url(#rsd-b)"/><circle class="note" cx="124" cy="68" r="9"/><text class="w" x="124" y="72" text-anchor="middle" font-size="11">1</text><text class="t" x="138" y="73">asks for a page — too often, or a checked page</text><path class="arrow" d="M390 132 H110" marker-end="url(#rsd-b)"/><circle class="note" cx="124" cy="118" r="9"/><text class="w" x="124" y="122" text-anchor="middle" font-size="11">2</text><text class="t" x="138" y="123">a small page with a signed task instead</text><path class="arrow" d="M110 162 h60 v36 h-58" marker-end="url(#rsd-b)"/><circle class="note" cx="186" cy="170" r="9"/><text class="w" x="186" y="174" text-anchor="middle" font-size="11">3</text><text class="t" x="200" y="176">solves it by itself — a fraction of a second</text><path class="arrow" d="M110 244 H390" marker-end="url(#rsd-b)"/><circle class="note" cx="124" cy="230" r="9"/><text class="w" x="124" y="234" text-anchor="middle" font-size="11">4</text><text class="t" x="138" y="235">the same page again, with the answer</text><rect class="okbox" x="300" y="258" width="180" height="30" rx="6" stroke-width="1.2"/><text class="t" x="390" y="278" text-anchor="middle" font-size="12">5 · answer right: &lt; 1 ms</text><path class="arrow" d="M390 316 H640" marker-end="url(#rsd-b)"/><circle class="note" cx="404" cy="302" r="9"/><text class="w" x="404" y="306" text-anchor="middle" font-size="11">6</text><text class="t" x="418" y="307">the request goes on</text><path class="arrow go" d="M640 356 H110" marker-end="url(#rsd-b)"/><circle class="note" cx="124" cy="342" r="9"/><text class="w" x="124" y="346" text-anchor="middle" font-size="11">7</text><text class="t" x="138" y="347">the page — and a pass for an hour</text><text class="m" x="110" y="400" font-size="12">Next pages: with the pass straight to the site. A bot without JavaScript never gets past step 2.</text></svg>
