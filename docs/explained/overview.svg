<svg class="rsd" role="img" viewBox="0 0 760 300" width="100%" xmlns="http://www.w3.org/2000/svg"><title>How request-shield sits in front of a site</title><style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .line{stroke:#c9ced6;stroke-width:3;fill:none}.rsd .go{stroke:#1e7b43}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .pass{fill:#1e7b43}.rsd .note{fill:#b07400}.rsd .stop{fill:#a3361f}.rsd .skip{fill:#b5bcc5}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .lane{stroke:#c9ced6;stroke-dasharray:4 4}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .line,.rsd .lane{stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .skip{fill:#555c66}}</style><defs><marker id="rsd-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs><rect class="box" x="10" y="40" width="150" height="56" rx="10" stroke-width="1.5"/><text class="t" x="85" y="64" text-anchor="middle" font-weight="700">Visitors</text><text class="m" x="85" y="82" text-anchor="middle" font-size="12">people, bots, crawlers</text><rect class="warnbox" x="250" y="40" width="220" height="56" rx="10" stroke-width="1.5"/><text class="t" x="360" y="64" text-anchor="middle" font-weight="700">request-shield</text><text class="m" x="360" y="82" text-anchor="middle" font-size="12">every request, in microseconds</text><rect class="okbox" x="580" y="40" width="170" height="56" rx="10" stroke-width="1.5"/><text class="t" x="665" y="64" text-anchor="middle" font-weight="700">Your site</text><text class="m" x="665" y="82" text-anchor="middle" font-size="12">CMS · 100–200 ms a page</text><path class="arrow" d="M160 68 H246" marker-end="url(#rsd-c)"/><path class="arrow go" d="M470 68 H576" marker-end="url(#rsd-c)"/><text class="m" x="523" y="60" text-anchor="middle" font-size="11">passes</text><path class="arrow" d="M360 96 V150 H110 V186" marker-end="url(#rsd-c)"/><rect class="nobox" x="40" y="190" width="140" height="56" rx="10" stroke-width="1.5"/><text class="t" x="110" y="214" text-anchor="middle" font-weight="700">junk, scanners</text><text class="m" x="110" y="232" text-anchor="middle" font-size="12">404 · 400</text><path class="arrow" d="M360 96 V150 H290 V186" marker-end="url(#rsd-c)"/><rect class="nobox" x="220" y="190" width="140" height="56" rx="10" stroke-width="1.5"/><text class="t" x="290" y="214" text-anchor="middle" font-weight="700">not for you</text><text class="m" x="290" y="232" text-anchor="middle" font-size="12">403 · 405</text><path class="arrow" d="M360 96 V150 H470 V186" marker-end="url(#rsd-c)"/><rect class="warnbox" x="400" y="190" width="140" height="56" rx="10" stroke-width="1.5"/><text class="t" x="470" y="214" text-anchor="middle" font-weight="700">suspicious</text><text class="m" x="470" y="232" text-anchor="middle" font-size="12">browser check</text><path class="arrow" d="M360 96 V150 H650 V186" marker-end="url(#rsd-c)"/><rect class="warnbox" x="580" y="190" width="140" height="56" rx="10" stroke-width="1.5"/><text class="t" x="650" y="214" text-anchor="middle" font-weight="700">too fast</text><text class="m" x="650" y="232" text-anchor="middle" font-size="12">a pause (429)</text><text class="m" x="380" y="280" text-anchor="middle" font-size="12">Answered by the shield itself: the site never renders a page for them.</text></svg>
