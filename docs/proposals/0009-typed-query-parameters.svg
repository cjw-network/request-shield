<svg class="rsd" role="img" viewBox="0 0 780 430" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>Each parameter of an address is looked up in the site's list: known and of its type, it passes unscanned; free text is scanned for attacks; unknown or of the wrong type, it is refused with query strict, else scanned and not cached</title>
<style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .go{stroke:#1e7b43}.rsd .no{stroke:#a3361f}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .qbox{fill:#eef3fd;stroke:#2f62c9}.rsd .okchip{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnchip{fill:#fdf3dc;stroke:#b07400}.rsd .nochip{fill:#fbe9e5;stroke:#a3361f}.rsd .tag{fill:#2f62c9}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox,.rsd .okchip{fill:#17301f}.rsd .warnbox,.rsd .warnchip{fill:#3a2f15}.rsd .nobox,.rsd .nochip{fill:#3d1f19}.rsd .qbox{fill:#1b2740;stroke:#7aa2ff}.rsd .tag{fill:#7aa2ff}}</style>
<defs><marker id="rs09-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs>
<rect class="box" x="10" y="14" width="760" height="70" rx="10" stroke-width="1.5"/>
<text class="t" x="26" y="38" font-weight="700">An address comes, with parameters</text>
<text class="t c" x="26" y="66">/list?</text>
<rect class="okchip" x="70" y="52" width="56" height="20" rx="6" stroke-width="1.2"/><text class="t c" x="98" y="66" text-anchor="middle">page=2</text>
<rect class="okchip" x="132" y="52" width="112" height="20" rx="6" stroke-width="1.2"/><text class="t c" x="188" y="66" text-anchor="middle">sort=price-asc</text>
<rect class="okchip" x="250" y="52" width="164" height="20" rx="6" stroke-width="1.2"/><text class="t c" x="332" y="66" text-anchor="middle">utm_source=newsletter</text>
<rect class="warnchip" x="420" y="52" width="92" height="20" rx="6" stroke-width="1.2"/><text class="t c" x="466" y="66" text-anchor="middle">q=red+shoes</text>
<rect class="nochip" x="518" y="52" width="64" height="20" rx="6" stroke-width="1.2"/><text class="t c" x="550" y="66" text-anchor="middle">debug=1</text>
<text class="m" x="594" y="66" font-size="12">— or page=2'</text>
<path class="arrow" d="M390 84 V110" marker-end="url(#rs09-a)"/>
<rect class="qbox" x="200" y="114" width="380" height="56" rx="10" stroke-width="1.5"/>
<text class="t" x="390" y="138" text-anchor="middle" font-weight="700">Does the site know it — and is it of its type?</text>
<text class="m" x="390" y="156" text-anchor="middle" font-size="12">each parameter, in the site's list: query page int …</text>
<path class="arrow" d="M390 170 V192 H200 V222" marker-end="url(#rs09-a)"/>
<path class="arrow" d="M390 192 V222" marker-end="url(#rs09-a)"/>
<path class="arrow" d="M390 192 H720 V222" marker-end="url(#rs09-a)"/>
<rect class="okbox" x="20" y="226" width="220" height="90" rx="10" stroke-width="1.5"/>
<rect class="tag" x="32" y="216" width="122" height="18" rx="9"/><text class="w" x="93" y="229" text-anchor="middle" font-size="11">a number, a word</text>
<text class="t" x="130" y="254" text-anchor="middle" font-weight="700">Through, not scanned</text>
<text class="m" x="130" y="273" text-anchor="middle" font-size="12">"2" cannot hold an attack:</text>
<text class="m" x="130" y="289" text-anchor="middle" font-size="12">no pattern needs to look</text>
<text class="m" x="130" y="305" text-anchor="middle" font-size="12">(marketing tags: @tracking)</text>
<rect class="warnbox" x="280" y="226" width="220" height="90" rx="10" stroke-width="1.5"/>
<rect class="tag" x="292" y="216" width="56" height="18" rx="9"/><text class="w" x="320" y="229" text-anchor="middle" font-size="11">text</text>
<text class="t" x="390" y="254" text-anchor="middle" font-weight="700">Through, scanned</text>
<text class="m" x="390" y="273" text-anchor="middle" font-size="12">free text, such as a search:</text>
<text class="m" x="390" y="289" text-anchor="middle" font-size="12">the attack patterns look —</text>
<text class="m" x="390" y="305" text-anchor="middle" font-size="12">only at these values</text>
<rect class="nobox" x="540" y="226" width="220" height="90" rx="10" stroke-width="1.5"/>
<rect class="tag" x="552" y="216" width="150" height="18" rx="9"/><text class="w" x="627" y="229" text-anchor="middle" font-size="11">unknown, wrong type</text>
<text class="t" x="650" y="254" text-anchor="middle" font-weight="700">strict: not found (404)</text>
<text class="m" x="650" y="273" text-anchor="middle" font-size="12">at once, before any pattern;</text>
<text class="m" x="650" y="289" text-anchor="middle" font-size="12">without strict: scanned,</text>
<text class="m" x="650" y="305" text-anchor="middle" font-size="12">answered, never cached</text>
<text class="m" x="20" y="354" font-size="12">Most parameters a site takes are numbers and words — a page, a sort order, a marketing tag. They need no</text>
<text class="m" x="20" y="372" font-size="12">search for attacks. Attack tools append parameters no page takes (?id=1' …): with strict they end here.</text>
<text class="m" x="20" y="398" font-size="12">An empty value (?page=) is of every type: forms send their empty fields.</text>
</svg>
