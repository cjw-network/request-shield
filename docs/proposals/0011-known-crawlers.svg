<svg class="rsd" role="img" viewBox="0 0 780 420" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>A crawler says who it is; the shield checks its address; a verified crawler gets what the site's policy says: through, checked, or refused</title>
<style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .go{stroke:#1e7b43}.rsd .no{stroke:#a3361f}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .qbox{fill:#eef3fd;stroke:#2f62c9}.rsd .tag{fill:#2f62c9}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .qbox{fill:#1b2740;stroke:#7aa2ff}.rsd .tag{fill:#7aa2ff}}</style>
<defs><marker id="rs11-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs>
<rect class="box" x="10" y="30" width="200" height="56" rx="10" stroke-width="1.5"/>
<text class="t" x="110" y="54" text-anchor="middle" font-weight="700">A crawler comes</text>
<text class="m" x="110" y="72" text-anchor="middle" font-size="12">"I am GPTBot" — says anyone</text>
<path class="arrow" d="M210 58 H266" marker-end="url(#rs11-a)"/>
<rect class="qbox" x="270" y="30" width="240" height="56" rx="10" stroke-width="1.5"/>
<text class="t" x="390" y="54" text-anchor="middle" font-weight="700">Is the address really theirs?</text>
<text class="m" x="390" y="72" text-anchor="middle" font-size="12">the operator's published list or DNS</text>
<path class="arrow no" d="M510 58 H576" marker-end="url(#rs11-a)"/>
<text class="m" x="543" y="50" text-anchor="middle" font-size="12">no</text>
<rect class="box" x="580" y="30" width="190" height="56" rx="10" stroke-width="1.5"/>
<text class="t" x="675" y="54" text-anchor="middle" font-weight="700">An ordinary visitor</text>
<text class="m" x="675" y="72" text-anchor="middle" font-size="12">the log notes the false name</text>
<path class="arrow go" d="M390 86 V124" marker-end="url(#rs11-a)"/>
<text class="m" x="398" y="112" font-size="12">yes, verified</text>
<rect class="box" x="230" y="128" width="320" height="56" rx="10" stroke-width="1.5"/>
<text class="t" x="390" y="152" text-anchor="middle" font-weight="700">What does the site want?</text>
<text class="m" x="390" y="170" text-anchor="middle" font-size="12">by kind of crawler, or one by one</text>
<path class="arrow" d="M390 184 V206 H130 V234" marker-end="url(#rs11-a)"/>
<path class="arrow" d="M390 206 V234" marker-end="url(#rs11-a)"/>
<path class="arrow" d="M390 206 H650 V234" marker-end="url(#rs11-a)"/>
<rect class="okbox" x="20" y="238" width="220" height="74" rx="10" stroke-width="1.5"/>
<rect class="tag" x="32" y="228" width="56" height="18" rx="9"/><text class="w" x="60" y="241" text-anchor="middle" font-size="11">allow</text>
<text class="t" x="130" y="264" text-anchor="middle" font-weight="700">Through</text>
<text class="m" x="130" y="283" text-anchor="middle" font-size="12">never the browser check;</text>
<text class="m" x="130" y="299" text-anchor="middle" font-size="12">too fast: "wait 30 s" (429)</text>
<rect class="warnbox" x="280" y="238" width="220" height="74" rx="10" stroke-width="1.5"/>
<rect class="tag" x="292" y="228" width="56" height="18" rx="9"/><text class="w" x="320" y="241" text-anchor="middle" font-size="11">check</text>
<text class="t" x="390" y="264" text-anchor="middle" font-weight="700">Like everyone</text>
<text class="m" x="390" y="283" text-anchor="middle" font-size="12">where the site checks browsers,</text>
<text class="m" x="390" y="299" text-anchor="middle" font-size="12">it cannot get past</text>
<rect class="nobox" x="540" y="238" width="220" height="74" rx="10" stroke-width="1.5"/>
<rect class="tag" x="552" y="228" width="56" height="18" rx="9"/><text class="w" x="580" y="241" text-anchor="middle" font-size="11">block</text>
<text class="t" x="650" y="264" text-anchor="middle" font-weight="700">No access (403)</text>
<text class="m" x="650" y="283" text-anchor="middle" font-size="12">for crawlers that ignore</text>
<text class="m" x="650" y="299" text-anchor="middle" font-size="12">robots.txt</text>
<text class="m" x="20" y="350" font-size="12">A crawler at a normal pace costs the site little — and being found in search and AI answers</text>
<text class="m" x="20" y="368" font-size="12">is what many sites want. The name alone proves nothing: only the address lets it through.</text>
<text class="m" x="20" y="394" font-size="12">Defaults: allow for search engines (as before) and for AI crawlers.</text>
</svg>
