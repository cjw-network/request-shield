<svg class="rsd" role="img" viewBox="0 0 780 400" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>The ladder: normal pace through; past challenge-at the browser check; past the limit a pause or a check that frees the counter, harder each time; still going, a temporary ban -- 429 with Retry-After, longer each time, ending by itself; never for the allow list, trusted proxies or verified crawlers</title>
<style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .qbox{fill:#eef3fd;stroke:#2f62c9}.rsd .tag{fill:#2f62c9}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .nobox{fill:#3d1f19}.rsd .qbox{fill:#1b2740;stroke:#7aa2ff}.rsd .tag{fill:#7aa2ff}}</style>
<defs><marker id="rs13b-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs>
<text class="t" x="20" y="26" font-weight="700">A client that does not stop: each step answers more firmly</text>
<rect class="okbox" x="20" y="222" width="170" height="92" rx="10" stroke-width="1.5"/>
<rect class="tag" x="32" y="212" width="18" height="18" rx="9"/><text class="w" x="41" y="225" text-anchor="middle" font-size="11">1</text>
<text class="t" x="105" y="250" text-anchor="middle" font-weight="700">Normal pace</text>
<text class="m" x="105" y="272" text-anchor="middle" font-size="12">through, as always</text>
<rect class="qbox" x="205" y="172" width="170" height="92" rx="10" stroke-width="1.5"/>
<rect class="tag" x="217" y="162" width="18" height="18" rx="9"/><text class="w" x="226" y="175" text-anchor="middle" font-size="11">2</text>
<text class="t" x="290" y="200" text-anchor="middle" font-weight="700">The browser check</text>
<text class="m" x="290" y="222" text-anchor="middle" font-size="12">past challenge-at:</text>
<text class="m" x="290" y="238" text-anchor="middle" font-size="12">a moment, then on</text>
<rect class="warnbox" x="390" y="122" width="170" height="92" rx="10" stroke-width="1.5"/>
<rect class="tag" x="402" y="112" width="18" height="18" rx="9"/><text class="w" x="411" y="125" text-anchor="middle" font-size="11">3</text>
<text class="t" x="475" y="150" text-anchor="middle" font-weight="700">Past the limit</text>
<text class="m" x="475" y="172" text-anchor="middle" font-size="12">a pause (429), or a check</text>
<text class="m" x="475" y="188" text-anchor="middle" font-size="12">twice as hard each time</text>
<rect class="nobox" x="575" y="72" width="185" height="98" rx="10" stroke-width="1.5"/>
<rect class="tag" x="587" y="62" width="18" height="18" rx="9"/><text class="w" x="596" y="75" text-anchor="middle" font-size="11">4</text>
<text class="t" x="667" y="100" text-anchor="middle" font-weight="700">A temporary ban</text>
<text class="m" x="667" y="122" text-anchor="middle" font-size="12">"wait 15 minutes" (429),</text>
<text class="m" x="667" y="138" text-anchor="middle" font-size="12">longer each time,</text>
<text class="m" x="667" y="154" text-anchor="middle" font-size="12">ends by itself</text>
<path class="arrow" d="M190 250 H200" marker-end="url(#rs13b-a)"/>
<path class="arrow" d="M375 200 H385" marker-end="url(#rs13b-a)"/>
<path class="arrow" d="M560 150 H570" marker-end="url(#rs13b-a)"/>
<text class="m" x="575" y="196" font-size="12">only when it keeps going:</text>
<text class="t c" x="575" y="214" font-size="11">ban after 5 limits in 10m</text>
<text class="t c" x="575" y="231" font-size="11">ban after 20 refusals in 5m</text>
<rect class="box" x="20" y="334" width="740" height="52" rx="10" stroke-width="1.5"/>
<text class="t" x="36" y="356" font-weight="700">Never banned:</text>
<text class="m" x="150" y="356" font-size="12">the allow list, trusted proxies, verified crawlers. Watch first with monitor ban;</text>
<text class="m" x="150" y="374" font-size="12">off by default — many people can share one address (an office, a mobile network).</text>
</svg>
