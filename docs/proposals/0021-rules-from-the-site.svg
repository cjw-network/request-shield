<svg class="rsd" role="img" viewBox="0 0 800 470" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>Request 1: the browser asks for the contact page; the shield checks it with the rule file; the CMS renders the form and adds a response header with a rule, "challenge **/contact max-age 10m"; at the end of the request the shield takes the header out (the browser never sees it), checks that it only tightens, and keeps it as a learned rule for a day. Request 2: the browser sends the form; the shield checks it with the rule file and the learned rule: the browser check first, then the CMS. Tightening is always allowed, loosening only where the rule file allows it, and restricted areas, blocked addresses and the path check never change.</title>
<style>.rsd{font:13px/1.2 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.rsd .box{fill:#fff;stroke:#c9ced6}.rsd .arrow{stroke:#5b6470;stroke-width:1.6;fill:none}.rsd .dash{stroke-dasharray:5 4}.rsd .okbox{fill:#e6f4ea;stroke:#1e7b43}.rsd .warnbox{fill:#fdf3dc;stroke:#b07400}.rsd .qbox{fill:#eef3fd;stroke:#2f62c9}.rsd .nobox{fill:#fbe9e5;stroke:#a3361f}.rsd .tag{fill:#2f62c9}.rsd .w{fill:#fff;font-weight:700}@media (prefers-color-scheme:dark){.rsd .t{fill:#e7e9ec}.rsd .m{fill:#a0a8b3}.rsd .box{fill:#1d2127;stroke:#3a414b}.rsd .arrow{stroke:#a0a8b3}.rsd .okbox{fill:#17301f}.rsd .warnbox{fill:#3a2f15}.rsd .qbox{fill:#1b2740;stroke:#7aa2ff}.rsd .nobox{fill:#3d1f19}.rsd .tag{fill:#7aa2ff}}</style>
<defs><marker id="a21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="m"/></marker></defs>

<!-- Request 1 -->
<text class="t" x="16" y="26" font-weight="700">Request 1 — the page with the form</text>
<rect class="box" x="16" y="42" width="120" height="54" rx="8"/>
<text class="t" x="76" y="64" text-anchor="middle" font-weight="600">Browser</text>
<text class="m c" x="76" y="82" text-anchor="middle">GET /contact</text>
<path class="arrow" d="M136 69 H176" marker-end="url(#a21)"/>
<rect class="qbox" x="178" y="42" width="130" height="54" rx="8"/>
<text class="t" x="243" y="64" text-anchor="middle" font-weight="600">request-shield</text>
<text class="m" x="243" y="82" text-anchor="middle" font-size="11">rule file: let through</text>
<path class="arrow" d="M308 69 H348" marker-end="url(#a21)"/>
<rect class="box" x="350" y="34" width="250" height="72" rx="8"/>
<text class="t" x="475" y="54" text-anchor="middle" font-weight="600">CMS renders the form, and says:</text>
<text class="tag c" x="475" y="73" text-anchor="middle">Request-Shield-Rule:</text>
<text class="tag c" x="475" y="90" text-anchor="middle">challenge **/contact max-age 10m</text>
<path class="arrow" d="M600 69 H640" marker-end="url(#a21)"/>
<rect class="qbox" x="642" y="30" width="142" height="80" rx="8"/>
<text class="t" x="713" y="50" text-anchor="middle" font-weight="600">at the end</text>
<text class="m" x="713" y="67" text-anchor="middle" font-size="11">header taken out</text>
<text class="m" x="713" y="82" text-anchor="middle" font-size="11">only tightens? ✓</text>
<text class="m" x="713" y="97" text-anchor="middle" font-size="11">kept for a day</text>
<path class="arrow dash" d="M713 110 V150" marker-end="url(#a21)"/>
<path class="arrow dash" d="M642 104 H620 V124 H136" marker-end="url(#a21)"/>
<text class="m" x="360" y="120" font-size="11">the page, without the header</text>

<!-- Learned rules -->
<rect class="warnbox" x="560" y="152" width="224" height="62" rx="8" stroke-width="1.5"/>
<text class="t" x="672" y="172" text-anchor="middle" font-weight="700">Learned from the site</text>
<text class="c t" x="672" y="190" text-anchor="middle">[APP-1] challenge **/contact</text>
<text class="m" x="672" y="206" text-anchor="middle" font-size="11">from /contact · until tomorrow</text>

<!-- Request 2 -->
<text class="t" x="16" y="262" font-weight="700">Request 2 — the form is sent</text>
<rect class="box" x="16" y="278" width="120" height="54" rx="8"/>
<text class="t" x="76" y="300" text-anchor="middle" font-weight="600">Browser</text>
<text class="m c" x="76" y="318" text-anchor="middle">POST /contact</text>
<path class="arrow" d="M136 305 H176" marker-end="url(#a21)"/>
<rect class="qbox" x="178" y="278" width="200" height="54" rx="8"/>
<text class="t" x="278" y="300" text-anchor="middle" font-weight="600">request-shield</text>
<text class="m" x="278" y="318" text-anchor="middle" font-size="11">rule file + learned rules</text>
<path class="arrow dash" d="M672 214 V240 H330 V276" marker-end="url(#a21)"/>
<path class="arrow" d="M378 305 H418" marker-end="url(#a21)"/>
<rect class="warnbox" x="420" y="278" width="170" height="54" rx="8" stroke-width="1.5"/>
<text class="t" x="505" y="300" text-anchor="middle" font-weight="700">browser check</text>
<text class="m" x="505" y="318" text-anchor="middle" font-size="11">once, the fields kept</text>
<path class="arrow" d="M590 305 H630" marker-end="url(#a21)"/>
<rect class="okbox" x="632" y="278" width="152" height="54" rx="8" stroke-width="1.5"/>
<text class="t" x="708" y="300" text-anchor="middle" font-weight="700">CMS</text>
<text class="m" x="708" y="318" text-anchor="middle" font-size="11">saves the message</text>

<!-- What the site may and may not change -->
<rect class="okbox" x="16" y="362" width="252" height="92" rx="8" stroke-width="1.2"/>
<text class="t" x="30" y="384" font-weight="700">Always allowed: tighten</text>
<text class="m" x="30" y="402" font-size="11.5">a check, a lower limit, strict parameters,</text>
<text class="m" x="30" y="418" font-size="11.5">"do not cache", count an event,</text>
<text class="m" x="30" y="434" font-size="11.5">known parameters of a page</text>
<rect class="warnbox" x="276" y="362" width="252" height="92" rx="8" stroke-width="1.2"/>
<text class="t" x="290" y="384" font-weight="700">Only where the rule file allows</text>
<text class="m" x="290" y="402" font-size="11.5">loosen: no limit, no check, open again</text>
<text class="c t" x="290" y="422">app-rules relax at **/hooks/**</text>
<text class="m" x="290" y="440" font-size="11.5">(a payment provider's callback)</text>
<rect class="nobox" x="536" y="362" width="252" height="92" rx="8" stroke-width="1.2"/>
<text class="t" x="550" y="384" font-weight="700">Never from the site</text>
<text class="m" x="550" y="402" font-size="11.5">restricted areas, blocked addresses,</text>
<text class="m" x="550" y="418" font-size="11.5">the path check, sizes, trusted proxies,</text>
<text class="m" x="550" y="434" font-size="11.5">the mode</text>
</svg>
