<rect class="card" x="16" y="192" width="868" height="196" rx="10"/>
<text class="tab" x="34" y="218">Visitors</text><path class="ul" d="M34 224 H88"/><text class="tabm" x="104" y="218">Page views</text>
<text class="m" x="200" y="218" font-size="12">per day · dashed: the 7 days before</text>
