<svg class="rsd" role="img" viewBox="0 0 900 1036" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>The visitors page, built from the shield's own data. Top: the period and "compare with the period before", and "now": people's requests in the last 5 minutes. A row of six numbers with their change: unique visitors, visits, page views by people, pages per visit, bounce rate and visit duration (all but page views only with the opt-in "set stats visitors on"), and below it the shield's own numbers: crawler visits, bot requests, stopped, not found. A line chart of visitors or page views per day, the period before dashed. A green line: 312 page views came from browsers that asked not to be counted (Global Privacy Control, Do Not Track) — not in the visitors, their addresses not used. Then six cards: top sources (channels, sources, campaigns), pages (pages, entry pages, sections, stopped, not found), where from (countries from a GeoIP database; networks: the intranet's areas by name or by their first two or three octets), devices (device class, browser, operating system), crawlers and AI (search, AI search, AI training), goals. Green dots: counted today; blue: a small new counter or option; violet: only with the visitor opt-in.</title>
<style>.rsd{font:13px/1.25 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .page{fill:#f4f6f9}.rsd .card{fill:#fff;stroke:#e3e7ec}.rsd .pill{fill:#fff;stroke:#d5dae1}.rsd .on{fill:#2f62c9}.rsd .onT{fill:#fff}.rsd .grid{stroke:#e8ebef}.rsd .line{stroke:#2f62c9;stroke-width:2;fill:none}.rsd .prev{stroke:#9aa3ae;stroke-width:2;stroke-dasharray:5 4;fill:none}.rsd .area{fill:#2f62c9;opacity:.08}.rsd .bar{fill:#2f62c9;opacity:.14}.rsd .have{fill:#1e7b43}.rsd .add{fill:#2f62c9}.rsd .opt{fill:#8b5cf6}.rsd .gpc{fill:#e6f4ea;stroke:#1e7b43}.rsd .gpcT{fill:#1e5c35}.rsd .up{fill:#1e7b43}.rsd .down{fill:#a3361f}.rsd .tab{fill:#1d2127;font-weight:600}.rsd .tabm{fill:#5b6470}.rsd .ul{stroke:#2f62c9;stroke-width:2}@media (prefers-color-scheme:dark){.rsd .t,.rsd .tab{fill:#e7e9ec}.rsd .m,.rsd .tabm{fill:#a0a8b3}.rsd .page{fill:#121519}.rsd .card{fill:#1b1f24;stroke:#2d333b}.rsd .pill{fill:#1b1f24;stroke:#3a414b}.rsd .grid{stroke:#2d333b}.rsd .line{stroke:#7aa2ff}.rsd .area,.rsd .bar,.rsd .on,.rsd .add{fill:#7aa2ff}.rsd .ul{stroke:#7aa2ff}.rsd .have,.rsd .up{fill:#4cc38a}.rsd .down{fill:#ff7a66}.rsd .opt{fill:#a78bfa}.rsd .gpc{fill:#17301f;stroke:#4cc38a}.rsd .gpcT{fill:#a7e3c2}}</style>
<rect class="page" x="0" y="0" width="900" height="1036" rx="10"/>

<!-- Header -->
<text class="t" x="24" y="34" font-size="17" font-weight="700">example.org</text>
<circle class="have" cx="186" cy="29" r="4"/><text class="m" x="196" y="34">now: 14 requests by people (5 min)</text>
<rect class="pill" x="470" y="16" width="56" height="26" rx="13"/><text class="m" x="498" y="33" text-anchor="middle" font-size="12">Today</text>
<rect class="on" x="532" y="16" width="62" height="26" rx="13"/><text class="onT" x="563" y="33" text-anchor="middle" font-size="12">7 days</text>
<rect class="pill" x="600" y="16" width="66" height="26" rx="13"/><text class="m" x="633" y="33" text-anchor="middle" font-size="12">30 days</text>
<rect class="pill" x="672" y="16" width="70" height="26" rx="13"/><text class="m" x="707" y="33" text-anchor="middle" font-size="12">12 months</text>
<rect class="pill" x="748" y="16" width="128" height="26" rx="13"/><text class="m" x="812" y="33" text-anchor="middle" font-size="12">☑ compare: before</text>

<!-- Numbers -->
<rect class="card" x="16" y="56" width="868" height="124" rx="10"/>
<g font-size="12">
<circle class="opt" cx="38" cy="76" r="4"/><text class="m" x="48" y="80">UNIQUE VISITORS</text><text class="t" x="34" y="110" font-size="24" font-weight="700">4,912</text><text class="up" x="34" y="130">↑ 14 %</text>
<circle class="opt" cx="182" cy="76" r="4"/><text class="m" x="192" y="80">VISITS</text><text class="t" x="178" y="110" font-size="24" font-weight="700">6,377</text><text class="up" x="178" y="130">↑ 11 %</text>
<circle class="have" cx="326" cy="76" r="4"/><text class="m" x="336" y="80">PAGE VIEWS</text><text class="t" x="322" y="110" font-size="24" font-weight="700">12,480</text><text class="up" x="322" y="130">↑ 18 %</text>
<circle class="opt" cx="470" cy="76" r="4"/><text class="m" x="480" y="80">PAGES / VISIT</text><text class="t" x="466" y="110" font-size="24" font-weight="700">1.96</text><text class="up" x="466" y="130">↑ 6 %</text>
<circle class="opt" cx="614" cy="76" r="4"/><text class="m" x="624" y="80">BOUNCE RATE</text><text class="t" x="610" y="110" font-size="24" font-weight="700">54 %</text><text class="up" x="610" y="130">↓ 3 %</text>
<circle class="opt" cx="758" cy="76" r="4"/><text class="m" x="768" y="80">VISIT DURATION</text><text class="t" x="754" y="110" font-size="24" font-weight="700">1m 48s</text><text class="up" x="754" y="130">↑ 9 %</text>
<path class="grid" d="M34 144 H866"/>
<circle class="have" cx="38" cy="162" r="4"/><text class="m" x="48" y="166">the shield:  4,215 crawler visits  ·  2,031 bot requests  ·  1,177 stopped  ·  96 not found</text>
</g>

<!-- A visitor's "no" -->
<rect class="gpc" x="16" y="188" width="868" height="28" rx="8" stroke-width="1"/>
<text class="gpcT" x="30" y="207" font-size="12.5"><tspan font-weight="700">✓ A visitor's "no" is honoured:</tspan> 312 page views from browsers that asked not to be counted (GPC, DNT) — not in the visitors.</text>
<g transform="translate(0,36)">
