<svg class="rsd" role="img" viewBox="0 0 900 820" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>The visitors page, built from the shield's own data. Top: the period (today, 7 days, 30 days, this month, last month, 12 months, a range) and "compare with the period before". A row of six numbers: page views by people, requests by people, crawler visits, bot requests, stopped by the shield, pages not found, each with its change against the period before, and "now": people's requests in the last 5 minutes. A line chart of page views per day, the period before as a dashed grey line. Then four cards: top sources (channels, sources, campaigns — needs the referrer counters of proposal 0018 and the campaign counter of 0020), pages (pages, sections, stopped, not found — there today), crawlers and AI instead of locations (search engines, AI search, AI training — there today), devices (device class, browser, operating system — 0018). Last: goals, page views of the pages that count as a goal (new, small). Green marks what the shield counts today, blue what a small counter adds. Not shown, on purpose: unique visitors, visits, bounce rate, visit duration, entry and exit pages, screen size, locations by default.</title>
<style>.rsd{font:13px/1.25 system-ui,sans-serif}.rsd .t{fill:#1d2127}.rsd .m{fill:#5b6470}.rsd .page{fill:#f4f6f9}.rsd .card{fill:#fff;stroke:#e3e7ec}.rsd .pill{fill:#fff;stroke:#d5dae1}.rsd .on{fill:#2f62c9}.rsd .onT{fill:#fff}.rsd .grid{stroke:#e8ebef}.rsd .line{stroke:#2f62c9;stroke-width:2;fill:none}.rsd .prev{stroke:#9aa3ae;stroke-width:2;stroke-dasharray:5 4;fill:none}.rsd .area{fill:#2f62c9;opacity:.08}.rsd .bar{fill:#2f62c9;opacity:.14}.rsd .have{fill:#1e7b43}.rsd .add{fill:#2f62c9}.rsd .no{fill:#8a929c}.rsd .up{fill:#1e7b43}.rsd .down{fill:#a3361f}.rsd .tab{fill:#1d2127;font-weight:600}.rsd .tabm{fill:#5b6470}.rsd .ul{stroke:#2f62c9;stroke-width:2}.rsd .dot{fill:#1e7b43}@media (prefers-color-scheme:dark){.rsd .t,.rsd .tab{fill:#e7e9ec}.rsd .m,.rsd .tabm{fill:#a0a8b3}.rsd .page{fill:#121519}.rsd .card{fill:#1b1f24;stroke:#2d333b}.rsd .pill{fill:#1b1f24;stroke:#3a414b}.rsd .grid{stroke:#2d333b}.rsd .line{stroke:#7aa2ff}.rsd .area,.rsd .bar,.rsd .on,.rsd .add{fill:#7aa2ff}.rsd .ul{stroke:#7aa2ff}.rsd .have,.rsd .up,.rsd .dot{fill:#4cc38a}.rsd .down{fill:#ff7a66}}</style>
